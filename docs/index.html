<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>阳光小学生的一天 - 校园生活与温馨小家</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd6ff; font-family: "Microsoft YaHei", sans-serif; }
  #app { width: 100vw; height: 100vh; display: block; }
  #ui {
    position: fixed; left: 0; top: 0; right: 0; z-index: 20;
    pointer-events: none; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #topbar {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 16px; font-size: 14px;
  }
  #info { background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 12px; line-height: 1.6; }
  #info #period { color: #ffd966; font-weight: bold; font-size: 16px; }
  #info #clock { font-family: monospace; font-size: 16px; margin: 0 6px; }
  #info #day { color: #a5d6ff; }
  #questHint {
    margin-top: 4px; font-size: 13px; color: #fff; background: rgba(25,118,210,0.7);
    padding: 3px 10px; border-radius: 6px; display: inline-block;
  }
  #stats {
    display: flex; gap: 12px; background: rgba(0,0,0,0.55);
    padding: 8px 14px; border-radius: 12px; line-height: 1.4;
  }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .stat i { font-style: normal; width: 26px; }
  .stat .bar {
    width: 80px; height: 8px; background: rgba(255,255,255,0.18);
    border-radius: 4px; overflow: hidden;
  }
  .stat .bar > div { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .stat em { font-style: normal; font-family: monospace; font-size: 12px; min-width: 22px; text-align: right; }
  #st-grades { background: #64b5f6; }
  #st-energy { background: #81c784; }
  #st-mood   { background: #ffd54f; }
  #st-know   { background: #ba68c8; }
  #bball {
    background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 12px;
    font-size: 14px; display: none; margin-top: 8px;
  }
  #bball b { color: #ffd966; font-family: monospace; font-size: 18px; }
  #help {
    position: fixed; left: 12px; bottom: 12px; z-index: 20;
    background: rgba(0,0,0,0.55); color: #fff; padding: 10px 14px; border-radius: 10px;
    font-size: 12px; line-height: 1.7; pointer-events: none; max-width: 380px;
  }
  #help kbd {
    background: #fff; color: #222; border-radius: 4px; padding: 1px 6px;
    font: 11px/1.5 monospace; box-shadow: 0 1px 0 #999;
  }
  #prompt {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.75); color: #fff; padding: 9px 22px; border-radius: 22px;
    font-size: 15px; display: none; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #prompt b { color: #ffd966; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: rgba(255,255,255,0.7); border-radius: 50%;
    z-index: 15; pointer-events: none; display: none;
  }
  #lockhint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 30;
    background: rgba(0,0,0,0.7); color:#fff; padding: 14px 24px; border-radius: 12px;
    font-size: 14px; text-align:center; pointer-events: none; display:none;
  }
  #lockhint b{color:#ffd966;}
  #fade {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: #000; opacity: 0; z-index: 50; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #rideOverlay {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%);
    z-index: 48; font-size: 24px; font-weight: bold; color: #ffd966;
    background: rgba(0,0,0,0.8); padding: 16px 36px; border-radius: 18px;
    display: none; pointer-events: none; text-align: center; line-height: 1.6;
  }
  #friends {
    position: fixed; right: 12px; bottom: 12px; z-index: 20;
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 12px; border-radius: 10px;
    font-size: 12px; line-height: 1.6; pointer-events: none; display: none;
  }
  #friends b { color: #ffd966; }
  #friends .fbar {
    display: inline-block; width: 50px; height: 6px; background: rgba(255,255,255,0.18);
    border-radius: 3px; overflow: hidden; vertical-align: middle; margin: 0 4px;
  }
  #friends .fbar > div { height: 100%; background: #ffb74d; border-radius: 3px; }
  #chat {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 25;
    background: rgba(20,20,30,0.95); color: #fff; padding: 0; border-radius: 14px;
    font-size: 14px; width: 460px; max-width: 92vw; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5); overflow: hidden;
  }
  #chatHead {
    padding: 10px 16px; background: rgba(255,255,255,0.08);
    font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center;
  }
  #chatHead .fri { font-size: 12px; color: #ffb74d; font-weight: normal; }
  #chatBody { padding: 14px 16px; line-height: 1.6; min-height: 48px; }
  #chatBody .npc-line { color: #e3f2fd; margin-bottom: 10px; }
  #chatBody .me-line { color: #c8e6c9; margin-bottom: 10px; text-align: right; }
  #chatOpts { padding: 0 16px 12px; }
  #chatOpts button {
    display: block; width: 100%; margin-top: 6px; padding: 9px 12px;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; font-size: 13px; cursor: pointer; text-align: left;
    transition: background 0.15s;
  }
  #chatOpts button:hover { background: rgba(255,255,255,0.25); }
  
  /* 答题面板 */
  #quiz {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45;
    background: rgba(30,30,55,0.98); color: #fff; padding: 22px 26px; border-radius: 20px;
    width: 520px; max-width: 90vw; max-height: 88vh; overflow-y: auto; display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    border: 3px solid rgba(255,215,102,0.55); text-align: center;
  }
  #quizHead {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 17px; font-weight: bold; color: #ffd966; margin-bottom: 4px;
  }
  #quizTitle { font-size: 22px; }
  #quizProgress { font-size: 15px; color: #a5d6ff; }
  #quizSpeak {
    background: #ffd966; color: #333; border: none; border-radius: 999px;
    padding: 6px 18px; font-size: 14px; cursor: pointer; margin: 8px auto 2px; display: inline-block;
  }
  #quizQuestion {
    font-size: 24px; font-weight: bold; line-height: 1.5; margin: 12px 0 12px;
    min-height: 60px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  #quizOpts { display: flex; flex-direction: column; gap: 9px; }
  #quizOpts button {
    display: block; width: 100%; padding: 12px 10px; border: none; border-radius: 12px;
    font-size: 20px; font-weight: bold; color: #fff; cursor: pointer; min-height: 52px;
    transition: transform 0.1s, opacity 0.2s;
  }
  #quizOpts button:hover { transform: scale(1.02); }
  #quizOpts .optA { background: #42a5f5; }
  #quizOpts .optB { background: #66bb6a; }
  #quizOpts .optC { background: #ffa726; }
  #quizMsg { font-size: 18px; margin: 10px 0 2px; min-height: 28px; font-weight: bold; }
  #quizQuit {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 8px; padding: 6px 20px; font-size: 14px; cursor: pointer; margin-top: 10px;
  }
  
  /* 接送选择面板 */
  #pickup {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 44;
    background: rgba(28,32,48,0.96); color: #fff; padding: 24px; border-radius: 18px;
    width: 380px; max-width: 90vw; display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    border: 2px solid #ffd966; text-align: center;
  }
  #pickupHead { font-size: 22px; font-weight: bold; color: #ffd966; margin-bottom: 8px; }
  #pickupBody { font-size: 15px; color: #e1f5fe; margin-bottom: 18px; }
  #pickupOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pickup-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px; padding: 14px 10px; font-size: 15px; cursor: pointer;
    color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .pickup-btn:hover { background: rgba(255,215,102,0.25); transform: scale(1.04); }
  .pickup-icon { font-size: 28px; }

  /* 书本阅读 */
  #bookUI {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 42;
    background: rgba(252,248,235,0.98); color: #333; padding: 26px 30px; border-radius: 14px;
    width: 480px; max-width: 88vw; max-height: 80vh; overflow-y: auto; display: none;
    box-shadow: 0 16px 56px rgba(0,0,0,0.5); border: 2px solid #c8a878; font-family: 'KaiTi', serif;
  }
  #bookTitle { font-size: 22px; font-weight: bold; color: #5d4037; text-align: center; margin-bottom: 4px; }
  #bookAuthor { font-size: 13px; color: #888; text-align: center; margin-bottom: 14px; font-style: italic; }
  #bookContent { font-size: 16px; line-height: 1.8; text-indent: 2em; color: #3e2723; text-align: justify; }
  #bookClose {
    display: block; margin: 18px auto 0; background: #5d4037; color: #fff; border: none;
    border-radius: 6px; padding: 8px 24px; font-size: 14px; cursor: pointer;
  }

  /* 触屏控制 */
  #touchUI { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 18; display: none; pointer-events: none; }
  #touchUI.active { display: block; }
  #joyBase {
    position: absolute; left: 40px; bottom: 50px; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3); pointer-events: auto; touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: rgba(255,255,255,0.5); pointer-events: none;
  }
  #lookZone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #touchBtns { position: absolute; right: 16px; bottom: 120px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .tbtn {
    width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; line-height: 1.15;
    pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .tbtn-primary { width: 76px; height: 76px; font-size: 15px; background: rgba(255,215,102,0.25); border: 2px solid #ffd966; }
</style>
</head>
<body>
<div id="ui">
  <div id="topbar">
    <div id="info">
      <div><span id="period">早读</span><span id="clock">07:00</span><span id="day">第1天</span></div>
      <div id="questHint">📍 目标：请前往主教学楼 1F 教室自己的座位早读</div>

    <div>
      <div id="stats">
        <div class="stat"><i>成绩</i><div class="bar"><div id="st-grades"></div></div><em id="v-grades">60</em></div>

  <div id="quizHead">

  <div id="bookTitle"></div>

  <div id="pickupOpts">
    <button class="pickup-btn" data-mode="walk"><span class="pickup-icon">🚶</span>走路回家<small>聊天散步</small></button>
    <button class="pickup-btn" data-mode="car"><span class="pickup-icon">🚗</span>爸爸开车<small>快速舒适</small></button>

    <button class="pickup-btn" data-mode="subway"><span class="pickup-icon">🚇</span>乘地铁<small>准时快捷</small></button>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   渲染器 / 场景 / 相机
============================================================ */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd6ff);
scene.fog = new THREE.Fog(0x9fd6ff, 200, 500);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1600);

const hemi = new THREE.HemisphereLight(0xcfeaff, 0x6b8f3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 480;
sun.shadow.camera.left = -140; sun.shadow.camera.right = 140;
sun.shadow.camera.top = 140;  sun.shadow.camera.bottom = -140;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   纹理生成工具
============================================================ */
function makeGroundTexture(base, dotFn) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2000; i++) {
    x.fillStyle = dotFn(Math.floor(Math.random() * 80));
    x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeWallTexture(baseColor, winColor = '#bfe3ff') {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = baseColor; x.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 3; i++) {
    x.fillStyle = '#fff'; x.fillRect(20 + i * 80, 25, 55, 75);
    x.fillStyle = winColor; x.fillRect(23 + i * 80, 28, 49, 69);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; return t;
}

/* ============================================================
   常量与碰撞体系
============================================================ */
const CAMPUS_HALF_X = 90, CAMPUS_HALF_Z = 110;
const GATE_Z = 105;
const MAIN = { cx: 0, cz: -30, w: 38, d: 24 };
const LIB  = { cx: -58, cz: -40, w: 20, d: 16 };
const GYM  = { cx: 60,  cz: -45, w: 26, d: 34 };
const LAB  = { cx: -58, cz: 0,   w: 18, d: 14 };
const CAF  = { cx: -55, cz: 55,  w: 24, d: 20 };
const DORM = { cx: 40,  cz: 55,  w: 26, d: 14 };
const COURT= { cx: 62,  cz: 44,  w: 14, d: 24 };
const FIELD= { cx: 63,  cz: 8,   r: 22 };
const PLAY = { cx: -30, cz: 42 };
const FOUNTAIN = { x: 10, z: 40 };

// 温馨小家所在世界坐标（远离校园的静谧街区）
const HOME = { cx: 280, cz: 280, w: 28, d: 20, h: 6 };

const colliders = [];
function addCollider(x0, x1, z0, z1) { colliders.push({ x0, x1, z0, z1 }); }

// 校园围墙
addCollider(-90, 90, -110.5, -109.6);
addCollider(-90, -12, 109.6, 110.5);
addCollider(12, 90, 109.6, 110.5);
addCollider(-90.5, -89.6, -110, 110);
addCollider(89.6, 90.5, -110, 110);

// 主楼外墙（留门洞 |x|<3）
addCollider(-19, 19, -42.5, -41.6);
addCollider(-19.5, -18.6, -42, -18);
addCollider(18.6, 19.5, -42, -18);
addCollider(-19, -3, -18.5, -17.6);
addCollider(3, 19, -18.5, -17.6);

// 温馨小家外墙（留门洞）
addCollider(HOME.cx - HOME.w/2, HOME.cx + HOME.w/2, HOME.cz - HOME.d/2, HOME.cz - HOME.d/2 + 0.5);
addCollider(HOME.cx - HOME.w/2, HOME.cx - HOME.w/2 + 0.5, HOME.cz - HOME.d/2, HOME.cz + HOME.d/2);
addCollider(HOME.cx + HOME.w/2 - 0.5, HOME.cx + HOME.w/2, HOME.cz - HOME.d/2, HOME.cz + HOME.d/2);
addCollider(HOME.cx - HOME.w/2, HOME.cx - 2, HOME.cz + HOME.d/2 - 0.5, HOME.cz + HOME.d/2);
addCollider(HOME.cx + 2, HOME.cx + HOME.w/2, HOME.cz + HOME.d/2 - 0.5, HOME.cz + HOME.d/2);

function collidePlayer(pos) {
  const r = 0.6;
  for (const c of colliders) {
    if (pos.x > c.x0 - r && pos.x < c.x1 + r && pos.z > c.z0 - r && pos.z < c.z1 + r) {
      const dxL = pos.x - (c.x0 - r), dxR = (c.x1 + r) - pos.x;
      const dzN = pos.z - (c.z0 - r), dzS = (c.z1 + r) - pos.z;
      const m = Math.min(dxL, dxR, dzN, dzS);
      if (m === dxL) pos.x = c.x0 - r;
      else if (m === dxR) pos.x = c.x1 + r;
      else if (m === dzN) pos.z = c.z0 - r;
      else pos.z = c.z1 + r;
    }
  }
}

/* ============================================================
   校园场景与建筑构建
============================================================ */
// 地面与道路
const grassTex = makeGroundTexture('#6aa84f', g => `rgb(${g-20},${g+60},${g-20})`);
grassTex.repeat.set(50, 50);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// 广场与主干道
const plazaTex = makeGroundTexture('#b7a99a', g => `rgb(${g+50},${g+40},${g+30})`);
plazaTex.repeat.set(10, 10);

const DAY_LEN = 480; // 8 分钟一个完整日夜循环
let dayTime = 0;

function hourNow() { return 7 + (dayTime / DAY_LEN) * 15; } // 07:00 -> 22:00

function periodAt(h) {
  if (h < 7.6)  return { name: '早读课', type: 'read', quest: '前往 1F 教室自己的座位朗读古诗 📖', sub: 'chinese', teacher: '林老师 (语文)' };
  if (h < 8.6)  return { name: '语文课', type: 'class', quest: '在教室听林老师讲语文课文 ✍️', sub: 'chinese', teacher: '林老师 (语文)' };
  if (h < 9.0)  return { name: '课间休息', type: 'break', quest: '下课啦！可以去操场散步或找同学聊天 🎈', sub: null };
  if (h < 10.0) return { name: '数学课', type: 'class', quest: '在教室听张老师讲加减乘除 ➕', sub: 'math', teacher: '张老师 (数学)' };
  if (h < 10.4) return { name: '大课间操', type: 'exercise', quest: '前往操场集合做广播体操 🏃', sub: null };
  if (h < 11.4) return { name: '英语课', type: 'class', quest: '在教室听 Miss White 讲英语单词 🔤', sub: 'english', teacher: 'Miss White' };
  if (h < 12.8) return { name: '午餐与午休', type: 'lunch', quest: '去食堂享用香喷喷的午餐吧 🍱', sub: null };
  if (h < 14.5) return { name: '自由活动课', type: 'activity', quest: '去篮球场投篮、图书馆阅读或玩滑梯 🏀', sub: null };
  if (h < 16.0) return { name: '放学时间', type: 'after', quest: '前往校门口，爸爸来接你回家啦 👨', sub: null };
  return { name: '家庭温馨时光', type: 'home', quest: '在家里吃晚饭、写作业、玩耍或睡觉 🏠', sub: null };
}

const quizEl = document.getElementById('quiz');
const quizTitleEl = document.getElementById('quizTitle');
const quizProgressEl = document.getElementById('quizProgress');
const quizQuestionEl = document.getElementById('quizQuestion');
const quizOptsEl = document.getElementById('quizOpts');
const quizMsgEl = document.getElementById('quizMsg');
const quizSpeakEl = document.getElementById('quizSpeak');
const quizQuitEl = document.getElementById('quizQuit');

let quizState = { active: false, cat: 'chinese', list: [], idx: 0, right: 0 };

function speakText(txt) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'zh-CN'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
quizSpeakEl.onclick = () => {
  const q = quizState.list[quizState.idx];
  if (q) speakText(q.speak || q.q);
};
quizQuitEl.onclick = closeQuiz;

function startQuiz(cat, title) {
  quizState.active = true; quizState.cat = cat;
  quizState.list = [...quizBank[cat]].sort(() => Math.random() - 0.5).slice(0, 3);
  quizState.idx = 0; quizState.right = 0;
  quizTitleEl.textContent = title;
  quizEl.style.display = 'block';
  renderQuiz();
}

function renderQuiz() {
  const q = quizState.list[quizState.idx];
  quizProgressEl.textContent = `第 ${quizState.idx + 1} / ${quizState.list.length} 题`;
  quizQuestionEl.textContent = q.q;
  quizMsgEl.textContent = '';
  quizOptsEl.innerHTML = '';
  const cls = ['optA', 'optB', 'optC'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = cls[i];
    btn.textContent = opt;
    btn.onclick = () => answerQuiz(i);
    quizOptsEl.appendChild(btn);
  });
  speakText(q.speak || q.q);
}

function answerQuiz(i) {
  const q = quizState.list[quizState.idx];
  if (i === q.ans) {
    quizState.right++;
    quizMsgEl.textContent = '🎉 答对啦！真聪明！';
    quizMsgEl.style.color = '#81c784';
    stats.grades += 3; stats.knowledge += 4;
  } else {
    quizMsgEl.textContent = `💡 正确答案是【${q.opts[q.ans]}】记住了哦`;
    quizMsgEl.style.color = '#ff8a80';
  }
  updateStatsUI();
  setTimeout(() => {
    quizState.idx++;
    if (quizState.idx < quizState.list.length) renderQuiz();
    else finishQuiz();
  }, 1200);
}

function finishQuiz() {
  quizTitleEl.textContent = '学习完成 🌟';
  quizProgressEl.textContent = '';
  quizQuestionEl.textContent = `本次答对 ${quizState.right} 道题！知识与成绩提升啦！`;
  quizOptsEl.innerHTML = '';
  quizMsgEl.textContent = '';
  const btn = document.createElement('button');
  btn.className = 'optB'; btn.textContent = '太棒了 (完成)';
  btn.onclick = closeQuiz; quizOptsEl.appendChild(btn);
}

function closeQuiz() {
  quizState.active = false; quizEl.style.display = 'none';
  if (stateLock) exitState();
}

/* ============================================================
   同学 NPC 聊天与交友系统
============================================================ */
const npcDefs = [
  { name: '小雨', topic: '你今天语文课文会背了吗？《春晓》好优美呀！', replyGood: '对呀！我也很喜欢，下课我们一起背！', replyBad: '没事，多读两遍就记住了～' },
  { name: '阿杰', topic: '等会儿自由活动课去操场踢球或者打篮球吧！', replyGood: '好耶！我带了足球，待会儿球场见！', replyBad: '那你想去的时候再叫我呀。' },
  { name: '婷婷', topic: '科学老师说今天天气真好，花园的花都开了！', replyGood: '真的！放学我们一起去花坛看看吧！', replyBad: '嗯嗯，太阳暖洋洋的真舒服。' }
];
const npcs = npcDefs.map((def, idx) => {
  const m = makeHumanModel(0x43a047, 0x1b5e20, 0x5d4037);
  m.position.set(-15 + idx * 12, 0, 30);
  scene.add(m);
  return { def, group: m, fri: 20 };
});

let chatActive = false;
let currentChatNpc = null;
const chatEl = document.getElementById('chat');
const chatNameEl = document.getElementById('chatName');
const chatFriEl = document.getElementById('chatFri');
const chatBodyEl = document.getElementById('chatBody');
const chatOptsEl = document.getElementById('chatOpts');

function openChat(st) {
  chatActive = true; currentChatNpc = st;
  chatNameEl.textContent = st.def.name;
  chatFriEl.textContent = '友好度 ' + st.fri;
  chatBodyEl.innerHTML = `<div class="npc-line">${st.def.topic}</div>`;
  chatOptsEl.innerHTML = '';
  
  const b1 = document.createElement('button');
  b1.textContent = '好呀！一起交流一起玩！';
  b1.onclick = () => {
    st.fri += 10; stats.mood += 5; updateStatsUI();
    chatBodyEl.innerHTML += `<div class="me-line">好呀！一起交流一起玩！</div><div class="npc-line">${st.def.replyGood}</div>`;
    chatOptsEl.innerHTML = '<button onclick="window.closeChatUI()">开心！关闭聊天 (E)</button>';
  };
  const b2 = document.createElement('button');
  b2.textContent = '我今天有点累，待会儿再说吧。';
  b2.onclick = () => {
    chatBodyEl.innerHTML += `<div class="me-line">我今天有点累，待会儿再说吧。</div><div class="npc-line">${st.def.replyBad}</div>`;
    chatOptsEl.innerHTML = '<button onclick="window.closeChatUI()">好的，拜拜 (E)</button>';
  };
  chatOptsEl.appendChild(b1); chatOptsEl.appendChild(b2);
  chatEl.style.display = 'block';
}
window.closeChatUI = () => { chatActive = false; chatEl.style.display = 'none'; };

/* ============================================================
   放学接送与交通工具过程
============================================================ */
let parentNPC = null;
const pickupEl = document.getElementById('pickup');
const rideOverlay = document.getElementById('rideOverlay');
const fadeEl = document.getElementById('fade');

function spawnParent() {
  if (parentNPC) return;
  parentNPC = makeHumanModel(0x37474f, 0x263238, 0x212121);
  parentNPC.scale.setScalar(1.15);
  parentNPC.position.set(0, 0, GATE_Z);
  scene.add(parentNPC);
}

function openPickupUI() {
  pickupEl.style.display = 'block';
}

pickupEl.querySelectorAll('.pickup-btn').forEach(btn => {
  btn.onclick = () => selectPickupMode(btn.dataset.mode);
});

function selectPickupMode(mode) {
  pickupEl.style.display = 'none';
  const rideTexts = {
    walk: '🚶 爸爸牵着你的小手，一边散步一边聊着学校的趣事回家...',
    car: '🚗 坐上爸爸的小轿车，伴随着欢快的音乐平稳驶向家门...',
    bus: '🚌 公交车缓缓进站，和小伙伴们挥手告别，坐车回家...',
    subway: '🚇 刷卡走进地铁站，乘坐飞驰的地铁准时到家...'
  };
  
  rideOverlay.textContent = rideTexts[mode];
  rideOverlay.style.display = 'block';
  fadeEl.style.opacity = '1';

  setTimeout(() => {
    // 瞬移到温馨小家
    girl.position.set(HOME.cx, 0, HOME.cz + 8);
    girl.rotation.y = Math.PI;
    yaw = Math.PI; camYaw = Math.PI;
    dayTime = DAY_LEN * 0.68; // 切换到傍晚家庭时间
    onPeriodChange();
    
    // 家长就位
    if (parentNPC) { scene.remove(parentNPC); parentNPC = null; }
    
    fadeEl.style.opacity = '0';
    rideOverlay.style.display = 'none';
    stats.mood += 10; updateStatsUI();
  }, 2200);
}

/* ============================================================
   交互点定义（校园 + 家庭）
============================================================ */
const stats = { grades: 60, energy: 100, mood: 90, knowledge: 40 };

const interactables = [
  // 校园
  { name: '我的座位', pos: playerDeskPos, radius: 2.5, prompt: '按 <b>E</b> 坐下<b>听课/早读</b>', state: 'study' },
  { name: '食堂', pos: new THREE.Vector3(CAF.cx, 0, CAF.cz), radius: 6, prompt: '按 <b>E</b> 吃<b>午餐</b>', state: 'canteen' },
  { name: '篮球场', pos: new THREE.Vector3(COURT.cx, 0, COURT.cz), radius: 7, prompt: '按 <b>E</b> 打<b>篮球</b>', state: 'basket' },
  { name: '操场', pos: new THREE.Vector3(FIELD.cx, 0, FIELD.cz), radius: 10, prompt: '按 <b>E</b> 做<b>课间操/跑步</b>', state: 'sport' },
  { name: '放学接送点', pos: new THREE.Vector3(0, 0, GATE_Z), radius: 5, prompt: '按 <b>E</b> 和<b>爸爸一起回家</b>', state: 'pickup' },
  
  // 温馨小家
  { name: '家庭餐桌', pos: new THREE.Vector3(HOME.cx + 6, 0, HOME.cz - 4), radius: 3, prompt: '按 <b>E</b> 吃<b>妈妈做的香喷喷晚饭</b>', state: 'homeEat' },
  { name: '家庭书桌', pos: new THREE.Vector3(HOME.cx - 8, 0, HOME.cz + 2), radius: 3, prompt: '按 <b>E</b> 认真<b>写家庭作业/复习</b>', state: 'homeHomework' },
  { name: '客厅电视/玩具', pos: new THREE.Vector3(HOME.cx + 6, 0, HOME.cz + 5), radius: 3, prompt: '按 <b>E</b> <b>看动画片/玩玩具</b>', state: 'homePlay' },
  { name: '温馨小床', pos: new THREE.Vector3(HOME.cx - 8, 0, HOME.cz - 6), radius: 3, prompt: '按 <b>E</b> <b>睡觉休息</b>，迎来美好新一天', state: 'homeSleep' }
];

let stateLock = false;
let currentState = null;

function tryInteract() {
  if (quizState.active) return;
  if (chatActive) { window.closeChatUI(); return; }
  
  // 检查是否靠近同学
  for (const st of npcs) {
    if (girl.position.distanceTo(st.group.position) < 3.5) {
      openChat(st); return;
    }
  }

  for (const it of interactables) {
    if (girl.position.distanceTo(it.pos) < it.radius) {
      handleInteraction(it.state);
      return;
    }
  }
}

function handleInteraction(state) {
  if (state === 'study') {
    stateLock = true; currentState = 'study';
    girl.position.set(playerDeskPos.x, 0, playerDeskPos.z + 0.6);
    girl.rotation.y = Math.PI;
    const sub = currentPeriod.sub || 'chinese';
    const names = { chinese: '语文课堂', math: '数学课堂', english: '英语课堂' };
    startQuiz(sub, names[sub] || '早读与学习');
  } else if (state === 'pickup') {
    openPickupUI();
  } else if (state === 'canteen') {
    stats.energy = Math.min(100, stats.energy + 30); stats.mood += 5;
    updateStatsUI();
    alert('🍱 在食堂享用了美味的鸡腿套餐！体力充沛！');
  } else if (state === 'homeEat') {
    stats.energy = 100; stats.mood = Math.min(100, stats.mood + 15);
    updateStatsUI();
    alert('🍲 吃到了妈妈做的热腾腾饭菜！好幸福！体力全满！');
  } else if (state === 'homeHomework') {
    startQuiz('math', '家庭作业 - 巩固练习 ✏️');
  } else if (state === 'homePlay') {
    stats.mood = 100; stats.energy = Math.max(0, stats.energy - 5);
    updateStatsUI();
    alert('🎮 看了喜欢的动画片，玩了积木，心情极佳！');
  } else if (state === 'homeSleep') {
    fadeEl.style.opacity = '1';
    rideOverlay.textContent = '🌙 盖好小被子进入甜美梦乡... 呼噜噜...';
    rideOverlay.style.display = 'block';
    setTimeout(() => {
      dayCount++;
      dayTime = 0; // 早上 7:00
      girl.position.copy(START_POS);
      girl.position.y = 0;
      onPeriodChange();
      fadeEl.style.opacity = '0';
      rideOverlay.style.display = 'none';
      stats.energy = 100; updateStatsUI();
      alert(`☀️ 叮铃铃！新的一天开始了（第 ${dayCount} 天），精神饱满地上学去啦！`);
    }, 2500);
  }
}

function exitState() {
  stateLock = false; currentState = null;
}

/* ============================================================
   UI 与数据更新
============================================================ */
const periodEl = document.getElementById('period');
const clockEl = document.getElementById('clock');
const dayEl = document.getElementById('day');
const promptEl = document.getElementById('prompt');
const gradesBar = document.getElementById('st-grades');
const energyBar = document.getElementById('st-energy');
const moodBar = document.getElementById('st-mood');
const knowBar = document.getElementById('st-know');
const vGrades = document.getElementById('v-grades');
const vEnergy = document.getElementById('v-energy');
const vMood = document.getElementById('v-mood');
const vKnow = document.getElementById('v-know');

function updateStatsUI() {
  gradesBar.style.width = stats.grades + '%';
  energyBar.style.width = stats.energy + '%';
  moodBar.style.width = stats.mood + '%';
  knowBar.style.width = stats.knowledge + '%';
  vGrades.textContent = Math.round(stats.grades);
  vEnergy.textContent = Math.round(stats.energy);
  vMood.textContent = Math.round(stats.mood);
  vKnow.textContent = Math.round(stats.knowledge);
}

function updatePrompt() {
  if (quizState.active || chatActive || pickupEl.style.display === 'block') {
    promptEl.style.display = 'none'; return;
  }
  let found = null;
  for (const it of interactables) {
    if (girl.position.distanceTo(it.pos) < it.radius) { found = it; break; }
  }
  if (!found) {
    for (const st of npcs) {
      if (girl.position.distanceTo(st.group.position) < 3.5) {
        found = { prompt: `按 <b>E</b> 和同学 <b>${st.def.name}</b> 聊天交友` }; break;
      }
    }
  }
  if (found) {
    promptEl.innerHTML = found.prompt; promptEl.style.display = 'block';
  } else {
    promptEl.style.display = 'none';
  }
}

/* ============================================================
   输入控制与相机跟踪
============================================================ */
const keys = {};
let camYaw = 0, camPitch = -0.3;
let yaw = 0;
const SPEED = 8;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (e.code === 'KeyQ') fastForward = !fastForward;
  if (e.code === 'KeyR') girl.position.copy(START_POS);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) {
  document.getElementById('touchUI').classList.add('active');
} else {
  renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement === renderer.domElement) {
      camYaw -= e.movementX * 0.0025;
      camPitch -= e.movementY * 0.0025;
      camPitch = Math.max(-1.1, Math.min(1.1, camPitch));
    }
  });
}

// 触屏按钮
document.getElementById('tBtnInteract').onclick = tryInteract;
document.getElementById('tBtnReset').onclick = () => girl.position.copy(START_POS);
let fastForward = false;
document.getElementById('tBtnFF').onclick = () => { fastForward = !fastForward; };

function updateCamera(immediate = false) {
  const back = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
  const targetCamPos = girl.position.clone().addScaledVector(back, 8.5);
  targetCamPos.y += 5.5;
  
  if (immediate) camera.position.copy(targetCamPos);
  else camera.position.lerp(targetCamPos, 0.2);
  camera.quaternion.setFromEuler(new THREE.Euler(camPitch, camYaw, 0, 'YXZ'));
}

/* ============================================================
   主循环
============================================================ */
const clock = new THREE.Clock();
let walkPhase = 0;

function update(dt) {
  dayTime += dt * (fastForward ? 8 : 1);
  if (dayTime >= DAY_LEN) { dayTime -= DAY_LEN; dayCount++; }
  
  const prevType = currentPeriod.type;
  const h = hourNow();
  const hh = String(Math.floor(h)).padStart(2, '0');
  const mm = String(Math.floor((h % 1) * 60)).padStart(2, '0');
  clockEl.textContent = `${hh}:${mm}`;
  periodEl.textContent = currentPeriod.name;
  dayEl.textContent = `第 ${dayCount} 天`;

  if (periodAt(h).type !== prevType) {
    onPeriodChange();
  }

  // 导航光环旋转
  navMarker.rotation.y += dt * 1.5;

  // 玩家移动
  if (!stateLock && !quizState.active && !chatActive) {
    const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);

    if (move.lengthSq() > 0) {
      const running = keys['ShiftLeft'] || keys['ShiftRight'];
      move.normalize().multiplyScalar((running ? SPEED * 1.8 : SPEED) * dt);
      girl.position.add(move);
      yaw = Math.atan2(move.x, move.z);
      girl.rotation.y = yaw;
      walkPhase += dt * 12;
      const s = Math.sin(walkPhase);
      girl.userData.legL.rotation.x = s * 0.6; girl.userData.legR.rotation.x = -s * 0.6;
    } else {
      girl.userData.legL.rotation.x *= 0.8; girl.userData.legR.rotation.x *= 0.8;
    }
  }

  collidePlayer(girl.position);
  updateCamera();
  updatePrompt();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

// 启动首帧
onPeriodChange();
updateStatsUI();
updateCamera(true);
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
