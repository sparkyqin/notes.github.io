============================================================ */
function makeCloud(x, y, z, s = 1) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.1 });
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(2.5 * s + Math.random(), 10, 8), m);
    b.position.set((Math.random() - 0.5) * 6 * s, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 4 * s);
    g.add(b);
  }
  g.position.set(x, y, z); scene.add(g); return g;
}
const clouds = [
  makeCloud(-60, 55, -70, 1.6), makeCloud(50, 60, -90, 1.8),
  makeCloud(100, 50, 30, 1.3), makeCloud(-90, 65, 50, 2),
  makeCloud(30, 70, 100, 1.5), makeCloud(130, 60, -40, 1.7),
];

/* ============================================================
   动画主循环
============================================================ */
const loopClock = new THREE.Clock();
let walkPhase = 0;
let statTicker = 0;

function update(dt) {
  // 时间推进（到家后冻结时间，必须睡觉才能进入次日）
  if (!atHome) dayTime += dt * (fastForward ? 4 : 1);
  if (dayTime >= DAY_LEN) { dayTime -= DAY_LEN; dayCount++; fastForward = false; updateFFUI(); }
  const prevPeriodType = currentPeriod.type;
  currentPeriod = periodAt(hourNow());
  if (currentPeriod.type !== prevPeriodType) {
    updateStateUI();
    playBell(currentPeriod.type === 'class' || currentPeriod.type === 'read');
    routeStudentAll();
    // 新的一天（早读）清理昨日残留的接送家长，避免阻塞当天放学
    if (currentPeriod.type === 'read') removeParent();
    // 放学时爸妈来接
    if (currentPeriod.type === 'after' && !parentNPC) {
      spawnParent();
    }
  }

  // 状态计时（答题中不自动退出，由答题流程结束状态）
  stateTimer += dt;
  const def = currentState ? stateDefs[currentState] : null;
  if (stateLock && def && def.time > 0 && stateTimer > def.time && !quizState.active) {
    exitState();
  }

  // 楼顶淡入淡出
  if (fadePhase === 1) {
    fadeTimer += dt;
    if (fadeTimer >= 0.32) {
      if (fadeAction) { fadeAction(); fadeAction = null; }
      fadePhase = 2; fadeTimer = 0;
      fadeEl.style.opacity = '0';
    }
  } else if (fadePhase === 2) {
    fadeTimer += dt;
    if (fadeTimer >= 0.32) { fadePhase = 0; fadeTimer = 0; }
  }
  // 聊天冷却
  if (chatCooldown > 0) chatCooldown = Math.max(0, chatCooldown - dt);
  // 接送面板冷却
  if (pickupCooldown > 0) pickupCooldown = Math.max(0, pickupCooldown - dt);

  // 体力缓慢消耗（跑动更费体力）
  stats.energy -= (keys['ShiftLeft'] || keys['ShiftRight'] ? 0.3 : 0.1) * dt;
  clampStats();
  statTicker += dt;
  if (statTicker > 0.25) { statTicker = 0; updateStatsUI(); updateStateUI(); }

  // 玩家路径移动（执行状态时自动走到目标点）
  // 手动摇杆/键盘可打断轻点寻路
  const manualMoveActive = (keys['KeyW'] || keys['KeyS'] || keys['KeyA'] || keys['KeyD'] ||
                            touchMove.fwd !== 0 || touchMove.strafe !== 0);
  if (!stateLock && manualMoveActive && girl.userData.path) {
    girl.userData.path = null;
    girl.userData.tapArrive = false;
  }
  const path = girl.userData.path;
  let moving = false;
  if (fadePhase > 0 || chatActive || pickupActive || readingBook || rideActive || atHome) {
    // 淡入淡出 / 聊天 / 阅读 / 接送 / 乘车 / 到家期间禁止自由移动
  } else if (pickupWalkHome) {
    // 和爸爸一起走向校门（自动跟随，不响应操作）
    const tx = 0, tz = GATE_Z + 8;
    const dir = new THREE.Vector3(tx - girl.position.x, 0, tz - girl.position.z);
    const dist = dir.length();
    if (dist > 1) {
      dir.normalize().multiplyScalar(SPEED * 0.55 * dt);
      girl.position.x += dir.x;
      girl.position.z += dir.z;
      walkPhase += dt * 8;
      moving = true;
    } else {
      finishPickupWalkHome();
    }
  } else if (path && path.length) {
    const tp = path[0];
    const dir = new THREE.Vector3(tp.x - girl.position.x, 0, tp.z - girl.position.z);
    const dist = dir.length();
    if (dist > 0.3) {
      dir.normalize().multiplyScalar(SPEED * 0.6 * dt);
      girl.position.x += dir.x;
      girl.position.z += dir.z;
      walkPhase += dt * 8;
      moving = true;
    } else {
      path.shift();
    }
    if (!path.length) {
      girl.userData.path = null;
      // 轻点到达：自动交互附近的设施（点教室 → 走到 → 自动上课）
      if (girl.userData.tapArrive) {
        girl.userData.tapArrive = false;
        if (chatCooldown <= 0) {
          for (const it of interactables) {
            if (girl.position.distanceTo(it.pos) < it.radius * (IS_TOUCH ? 1.5 : 1)) { tryInteract(); break; }
          }
        }
      }
    }
  } else if (!stateLock) {
    const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    // 触屏：叠加虚拟摇杆
    if (touchMove.fwd !== 0 || touchMove.strafe !== 0) {
      move.addScaledVector(forward, touchMove.fwd);
      move.addScaledVector(right, touchMove.strafe);
    }
    const running = (keys['ShiftLeft'] || keys['ShiftRight']) || touchRun;
    const sp = running ? RUN : SPEED;
    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(sp * dt);
      girl.position.x += move.x;
      girl.position.z += move.z;
      yaw = Math.atan2(move.x, move.z);
      walkPhase += dt * (running ? 16 : 10);
      moving = true;
    }
    if (keys['Space'] && onGround) { yVel = 9; onGround = false; }
  }

  // 重力（滑梯动画期间由动画控制 Y；乘车期间由车辆控制 Y，不下落）
  if (slidePhase < 0 && !rideActive) {
    if (!onGround) {
      yVel -= GRAVITY * dt;
      girl.position.y += yVel * dt;
      if (girl.position.y <= floorLevel) { girl.position.y = floorLevel; yVel = 0; onGround = true; }
    } else {
      girl.position.y = floorLevel;
    }
  }
  gy = girl.position.y;

  // 地面层（1F）：若走出建筑门洞范围，恢复正常地面碰撞
  if (currentFloorBuilding && floorLevel === 0) {
    const b = currentFloorBuilding;
    if (girl.position.x < b.x - b.w / 2 || girl.position.x > b.x + b.w / 2 ||
        girl.position.z < b.z - b.d / 2 || girl.position.z > b.z + b.d / 2) {
      currentFloorBuilding = null;
    }
  }

  // 楼顶/楼层边界限制（替代地面碰撞，楼层上同样限制在建筑占地内避免空中走路）
  const boundaryBuilding = currentRooftop || currentFloorBuilding;
  if (rideActive) {
    // 乘车期间：不碰撞、不夹墙，位置完全由 updateRide 控制
  } else if (boundaryBuilding) {
    const b = boundaryBuilding;
    const m = 0.8;
    girl.position.x = Math.max(b.x - b.w / 2 + m, Math.min(b.x + b.w / 2 - m, girl.position.x));
    girl.position.z = Math.max(b.z - b.d / 2 + m, Math.min(b.z + b.d / 2 - m, girl.position.z));
  } else if (slidePhase < 0) {
    collidePlayer(girl.position);
  }

  // 朝向（滑梯动画期间由动画控制朝向；乘车期间由 startRideHome 固定）
  if (slidePhase < 0 && !rideActive) {
    if (path && path.length) {
      const tp = path[0];
      girl.rotation.y = Math.atan2(tp.x - girl.position.x, tp.z - girl.position.z);
    } else if (girl.userData.targetRot !== undefined) {
      girl.rotation.y = girl.userData.targetRot;
    } else if (!stateLock) {
      girl.rotation.y = yaw;
    }
  }

  // 走路 / 坐下动画
  if (moving && onGround) {
    const s = Math.sin(walkPhase);
    legL.rotation.x = s * 0.6;
    legR.rotation.x = -s * 0.6;
    armL.rotation.x = -s * 0.5;
    armR.rotation.x = s * 0.5;
  } else if (girl.userData.sitting && !girl.userData.path) {
    legL.rotation.x = -1.2; legR.rotation.x = -1.2;
    armL.rotation.x = -0.6; armR.rotation.x = -0.6;
  } else {
    legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
    armL.rotation.x *= 0.8; armR.rotation.x *= 0.8;
  }

  // 马尾飘动
  const t = performance.now() * 0.005;
  if (ponytails.length) {
    ponytails[0].tail.rotation.z = Math.sin(t) * 0.15 - 0.1;
    ponytails[1].tail.rotation.z = -Math.sin(t) * 0.15 + 0.1;
  }

  // 秋千 / 跷跷板动画
  if (currentState === 'swing' && !girl.userData.path && swing.userData.swingSeat) {
    const sw = Math.sin(performance.now() * 0.002) * 0.5;
    swing.userData.swingSeat.rotation.x = sw;
    girl.position.y = Math.abs(Math.sin(performance.now() * 0.002)) * 0.5;
    gy = girl.position.y;
  } else if (swing.userData.swingSeat) {
    swing.userData.swingSeat.rotation.x *= 0.9;
  }
  if (seesaw.userData.board) {
    seesaw.userData.board.rotation.z = Math.sin(performance.now() * 0.0015) * 0.12;
  }
  flag.rotation.y = Math.sin(performance.now() * 0.003) * 0.3;

  // 滑梯动画（到达 slideSpot 后自动循环：爬梯→滑下→走回）
  if (currentState === 'play' && !girl.userData.path && slidePhase < 0) {
    slidePhase = 0; slideTimer = 0;
  }
  if (slidePhase >= 0) {
    slideTimer += dt;
    const cx = PLAY.cx, cz = PLAY.cz;
    const dur = [1.0, 1.6, 0.4, 1.8, 1.2];
    const p = Math.min(1, slideTimer / dur[slidePhase]);
    if (slidePhase === 0) {           // 走向楼梯底
      girl.position.x = THREE.MathUtils.lerp(cx - 2, cx, p);
      girl.position.z = THREE.MathUtils.lerp(cz, cz - 1, p);
      girl.position.y = 0;
      girl.rotation.y = Math.atan2(2, -1);
      walkPhase += dt * 8;
      const s = Math.sin(walkPhase);
      legL.rotation.x = s * 0.6; legR.rotation.x = -s * 0.6;
      armL.rotation.x = -s * 0.5; armR.rotation.x = s * 0.5;
    } else if (slidePhase === 1) {    // 爬梯到平台
      girl.position.x = cx;
      girl.position.z = cz - 1 + p;
      girl.position.y = THREE.MathUtils.lerp(0, 3.6, p);
      girl.rotation.y = Math.PI;
      walkPhase += dt * 6;
      const s = Math.sin(walkPhase);
      legL.rotation.x = s * 0.5; legR.rotation.x = -s * 0.5;
      armL.rotation.x = -s * 0.6; armR.rotation.x = s * 0.6;
    } else if (slidePhase === 2) {    // 移到滑道口
      girl.position.x = cx;
      girl.position.z = cz + p * 0.5;
      girl.position.y = 3.5;
      girl.rotation.y = 0;
      legL.rotation.x = -0.8; legR.rotation.x = -0.8;
      armL.rotation.x = -0.3; armR.rotation.x = -0.3;
    } else if (slidePhase === 3) {    // 滑下
      const st = p;
      girl.position.x = cx;
      girl.position.z = cz + 0.5 + st * 4.5;
      girl.position.y = 3.5 - st * st * 3.3;
      girl.rotation.y = 0;
      // 坐姿前倾
      legL.rotation.x = -1.3; legR.rotation.x = -1.3;
      armL.rotation.x = -0.4; armR.rotation.x = -0.4;
    } else if (slidePhase === 4) {    // 走回起点
      girl.position.x = THREE.MathUtils.lerp(cx, cx - 2, p);
      girl.position.z = THREE.MathUtils.lerp(cz + 5, cz, p);
      girl.position.y = 0;
      girl.rotation.y = Math.atan2(-2, -5);
      walkPhase += dt * 8;
      const s = Math.sin(walkPhase);
      legL.rotation.x = s * 0.6; legR.rotation.x = -s * 0.6;
      armL.rotation.x = -s * 0.5; armR.rotation.x = s * 0.5;
    }
    gy = girl.position.y;
    if (p >= 1) { slidePhase = (slidePhase + 1) % 5; slideTimer = 0; }
  }

  // NPC 更新
  updateNPCs(dt);
  updateFriendFollow(dt);
  updateParent(dt);
  updateTeacher(dt);
  updateRide(dt);

  // 篮球
  if (bball.active && !girl.userData.path) {
    updateBall(dt);
    // 时间到了自动结束
    if (stateTimer > 60) exitState();
  }

  // 车辆移动（全在校园外）
  cars.forEach(c => {
    const r = c.userData;
    r.t += r.speed * r.dir;
    if (r.road === 'S') { c.position.set(r.t, 0, ringZ1); c.rotation.y = r.dir > 0 ? 0 : Math.PI; }
    else if (r.road === 'N') { c.position.set(r.t, 0, ringZ2); c.rotation.y = r.dir > 0 ? 0 : Math.PI; }
    else if (r.road === 'E') { c.position.set(ringX1, 0, r.t); c.rotation.y = r.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
    else if (r.road === 'W') { c.position.set(ringX2, 0, r.t); c.rotation.y = r.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
    else if (r.road === 'Oz170') { c.position.set(r.t, 0, 170); c.rotation.y = r.dir > 0 ? 0 : Math.PI; }
    else if (r.road === 'Oz-170') { c.position.set(r.t, 0, -170); c.rotation.y = r.dir > 0 ? 0 : Math.PI; }
    else if (r.road === 'Ox165') { c.position.set(165, 0, r.t); c.rotation.y = r.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
    else if (r.road === 'Ox-165') { c.position.set(-165, 0, r.t); c.rotation.y = r.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
    if (r.t > 185) r.t = -185;
    if (r.t < -185) r.t = 185;
  });

  // 云
  clouds.forEach(cl => {
    cl.position.x += 0.02;
    if (cl.position.x > 190) cl.position.x = -190;
  });

  applySky();
  updateCamera();
  updatePrompt();
}

function routeStudentAll() {
  npcs.forEach(st => { st.zoneKey = currentPeriod.type; routeStudent(st, currentPeriod.type); });
}

// 老师显示/隐藏 + 讲台科目牌 + 微小站立动画
function updateTeacher(dt) {
  if (!teacherNPC) return;
  const onDuty = (currentPeriod.type === 'class' || currentPeriod.type === 'read')
    && !atHome && !rideActive && !pickupWalkHome;
  if (onDuty !== teacherNPC.visible) teacherNPC.visible = onDuty;
  if (!onDuty) {
    if (subjectBoard) subjectBoard.visible = false;
    return;
  }
  // 科目牌内容
  const label = currentPeriod.type === 'read' ? '早读 · 语文'
    : (SUBJECT_LABEL[currentPeriod.subject] || '语文') + ' 课';
  if (subjectBoard) {
    if (!subjectBoard.visible || subjectBoard.userData.label !== label) {
      drawSubjectBoard(label);
      subjectBoard.userData.label = label;
    }
    subjectBoard.visible = true;
  }
  // 老师面朝学生（+z），讲台前轻微踱步/手势
  teacherNPC.userData.idleT += dt;
  const t = teacherNPC.userData.idleT;
  const ud = teacherNPC.userData;
  // 朝向学生
  teacherNPC.rotation.y = Math.sin(t * 0.6) * 0.25;
  // 手臂小幅摆动（像在讲课/指点）
  ud.armL.rotation.x = -0.3 + Math.sin(t * 2.2) * 0.18;
  ud.armR.rotation.x = -0.2 + Math.cos(t * 2.2) * 0.22;
  // 身体微幅起伏
  teacherNPC.position.y = Math.abs(Math.sin(t * 1.8)) * 0.04;
  ud.legL.rotation.x *= 0.85; ud.legR.rotation.x *= 0.85;
}

function updateNPCs(dt) {
  npcs.forEach(st => {
    // 已经回家的NPC不更新
    if (st.wentHome) return;

    // 聊天中的NPC停止移动
    if (chatActive && chatNPC === st) {
      // 面向玩家
      const dx = girl.position.x - st.group.position.x;
      const dz = girl.position.z - st.group.position.z;
      st.group.rotation.y = Math.atan2(dx, dz);
      // 站立动画
      const ud = st.group.userData;
      ud.legL.rotation.x *= 0.8;
      ud.legR.rotation.x *= 0.8;
      ud.armL.rotation.x *= 0.8;
      ud.armR.rotation.x *= 0.8;
      return;
    }
    if (st.path.length) {
      const target = st.path[0];
      const dx = target.x - st.group.position.x;
      const dz = target.z - st.group.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.7) {
        st.path.shift();
        if (!st.path.length) {
          st.state = st.arrive;
          st.baseRot = st.group.rotation.y;   // 待机摆动以当前朝向为基准
          // 如果到达状态是回家，则让NPC消失
          if (st.arrive === 'goHome') {
            st.wentHome = true;
            st.group.visible = false;
          }
        }
      } else {
        const v = st.speed * dt;
        st.group.position.x += (dx / d) * v;
        st.group.position.z += (dz / d) * v;
        st.group.position.y = 0;
        st.group.rotation.y = Math.atan2(dx, dz);
        st.walkPhase += dt * 7;
        st.state = 'walk';
      }
    }
    const ud = st.group.userData;
    if (st.state === 'sit') {
      ud.legL.rotation.x = -1.2; ud.legR.rotation.x = -1.2;
      ud.armL.rotation.x = -0.6; ud.armR.rotation.x = -0.6;
      if (!st.path.length) st.group.rotation.y = Math.PI;
    } else if (st.state === 'walk') {
      const s = Math.sin(st.walkPhase);
      ud.legL.rotation.x = s * 0.5; ud.legR.rotation.x = -s * 0.5;
      ud.armL.rotation.x = -s * 0.4; ud.armR.rotation.x = s * 0.4;
    } else {
      ud.legL.rotation.x *= 0.8; ud.legR.rotation.x *= 0.8;
      ud.armL.rotation.x *= 0.8; ud.armR.rotation.x *= 0.8;
      // 待机：轻微左右转身 + 呼吸起伏，显得有生气
      if (!st.path.length && !chatActive) {
        st.idleT = (st.idleT || 0) + dt;
        if (st.baseRot === undefined) st.baseRot = st.group.rotation.y;
        st.group.rotation.y = st.baseRot + Math.sin(st.idleT * 0.9) * 0.08;
        st.group.position.y = Math.abs(Math.sin(st.idleT * 1.6)) * 0.03;
      }
    }
  });
}

/* ============================================================
   父母接送系统（爸爸 / 妈妈 随机）
============================================================ */
let parentNPC = null;
let parentState = 'none';    // none / approaching / waiting / leaving
let parentSex = 'dad';       // dad / mom
let pickupActive = false;
let pickupCooldown = 0;      // 关闭接送面板后的短暂冷却，避免立刻重开
const PARENT_MEET = new THREE.Vector3(0, 0, GATE_Z - 8); // 校门内侧广场：家长固定在这里等
const pickupEl = document.getElementById('pickup');
const pickupHeadEl = document.getElementById('pickupHead');

function parentLabel() { return parentSex === 'mom' ? '妈妈' : '爸爸'; }

function spawnParent() {
  if (parentNPC) return;
  // 随机爸爸或妈妈
  parentSex = Math.random() < 0.5 ? 'mom' : 'dad';
  if (parentSex === 'mom') {
    parentNPC = makeStudent({
      skin: 0xf8d0b0, hair: 0x3e2723, top: 0xc2185b, bottom: 0x4a148c, shoe: 0x1a1a1a,
      ponytails: true,
    });
  } else {
    parentNPC = makeStudent({
      skin: 0xf5cba0, hair: 0x212121, top: 0x424242, bottom: 0x263238, shoe: 0x1a1a1a,
      ponytails: false,
    });
  }
  parentNPC.scale.setScalar(1.15);
  parentNPC.position.set(0, 0, GATE_Z + 12);   // 从校门外走进来
  parentNPC.userData.walkPhase = 0;
  scene.add(parentNPC);
  parentState = 'approaching';
  promptEl.innerHTML = '👨‍👧 ' + parentLabel() + '来接你啦，正在校门口等你…';
  promptEl.style.display = 'block';
}

// 彻底清理接送家长 + 回家选择状态（新的一天 / 重置位置 / 到家兜底）
function removeParent() {
  if (parentNPC) { scene.remove(parentNPC); parentNPC = null; }
  parentState = 'none';
  pickupWalkHome = false;
  pickupActive = false;
  pickupEl.style.display = 'none';
}

function animateParentWalk(s) {
  if (!parentNPC) return;
  const ud = parentNPC.userData;
  ud.legL.rotation.x = s * 0.5;
  ud.legR.rotation.x = -s * 0.5;
  ud.armL.rotation.x = -s * 0.4;
  ud.armR.rotation.x = s * 0.4;
}
function animateParentIdle() {
  if (!parentNPC) return;
  const ud = parentNPC.userData;
  ud.legL.rotation.x *= 0.8;
  ud.legR.rotation.x *= 0.8;
  ud.armL.rotation.x *= 0.8;
  ud.armR.rotation.x *= 0.8;
}

function updateParent(dt) {
  // 到家后不应再有接送的家长；若残留则清掉
  if (atHome) {
    if (parentNPC) removeParent();
    return;
  }
  if (!parentNPC) return;

  if (parentState === 'approaching') {
    // 走到校门内侧固定集合点等待（不再追着玩家跑，避免永远追不上）
    const dx = PARENT_MEET.x - parentNPC.position.x;
    const dz = PARENT_MEET.z - parentNPC.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 1.2) {
      parentNPC.position.copy(PARENT_MEET);
      parentState = 'waiting';
    } else {
      const sp = 3.4 * dt;
      parentNPC.position.x += (dx / dist) * sp;
      parentNPC.position.z += (dz / dist) * sp;
      parentNPC.rotation.y = Math.atan2(dx, dz);
      parentNPC.userData.walkPhase += dt * 7;
      animateParentWalk(Math.sin(parentNPC.userData.walkPhase));
    }
  } else if (parentState === 'waiting') {
    const dx = girl.position.x - parentNPC.position.x;
    const dz = girl.position.z - parentNPC.position.z;
    parentNPC.rotation.y = Math.atan2(dx, dz);
    animateParentIdle();
    // 玩家靠近 → 弹出回家选择（可重复触发：ESC 关闭后靠近仍会再开）
    if (!pickupActive && !pickupWalkHome && pickupCooldown <= 0 &&
        !quizState.active && Math.hypot(dx, dz) < 6) {
      openPickupUI();
    }
  } else if (parentState === 'leaving') {
    const tx = 0, tz = GATE_Z + 15;
    const dx = tx - parentNPC.position.x;
    const dz = tz - parentNPC.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 1) {
      removeParent();
    } else {
      const sp = 3.4 * dt;
      parentNPC.position.x += (dx / dist) * sp;
      parentNPC.position.z += (dz / dist) * sp;
      parentNPC.rotation.y = Math.atan2(dx, dz);
      parentNPC.userData.walkPhase += dt * 7;
      animateParentWalk(Math.sin(parentNPC.userData.walkPhase));
    }
  }
}

function openPickupUI() {

/* ============================================================
   乘车回家系统（真实 3D 乘车 + 到家场景）
=========================================================== */
let rideActive = false;      // 乘车中
let rideMode = 'walk';       // walk / car / bus / subway
let rideTimer = 0;           // 乘车已过秒数
const RIDE_DURATION = 7;     // 乘车展示时长（秒）
let rideVehicle = null;      // 当前车辆 group
let rideLights = [];         // 地铁隧道灯（每帧前移制造速度感）
let rideParentSeat = null;   // 家长在车里的引用
let atHome = false;          // 是否在家场景中
let homeGroup = null;

// 公交车工厂（单节大客车）
function makeBus(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 2.6),
    new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.2 }));
  body.position.y = 1.8; body.castShadow = true; g.add(body);
  // 车窗带
  const winMat = new THREE.MeshStandardMaterial({ color: 0x1a3a4a, roughness: 0.1, metalness: 0.4, transparent: true, opacity: 0.75 });
  for (let i = 0; i < 4; i++) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.1, 2.65), winMat);
    w.position.set(-2.6 + i * 1.75, 2.5, 0); g.add(w);
  }
  const frontWin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.1, 2.65), winMat);
  frontWin.position.set(3.4, 2.5, 0); g.add(frontWin);
  // 车头灯
  const hlMat = new THREE.MeshStandardMaterial({ color: 0xfff59d, emissive: 0xfff59d, emissiveIntensity: 0.6 });
  [-0.9, 0.9].forEach(z => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.3), hlMat);
    hl.position.set(4.05, 1.4, z); g.add(hl);
  });
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
  for (let wx of [-3, 0, 3]) for (let wz of [-1.3, 1.3]) {
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.35, 14), wheelMat);
    wh.rotation.x = Math.PI / 2; wh.position.set(wx, 0.55, wz); g.add(wh);
  }
  return g;
}

// 地铁车厢工厂（封闭车厢，侧窗 + 座椅）
function makeSubwayCar() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(9, 3.2, 3),
    new THREE.MeshStandardMaterial({ color: 0x9aa7b0, roughness: 0.3, metalness: 0.6 }));
  body.position.y = 1.8; body.castShadow = true; g.add(body);
  const winMat = new THREE.MeshStandardMaterial({ color: 0x10243a, roughness: 0.05, metalness: 0.5, transparent: true, opacity: 0.7 });
  for (let i = 0; i < 5; i++) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 3.05), winMat);
    w.position.set(-3 + i * 1.5, 2.3, 0); g.add(w);
  }
  // 车厢顶部灯光条
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff8e1, emissive: 0xfff8e1, emissiveIntensity: 0.9 });
  const lightBar = new THREE.Mesh(new THREE.BoxGeometry(8, 0.12, 1.2), lightMat);
  lightBar.position.set(0, 3.25, 0); g.add(lightBar);
  return g;
}

// 启动乘车回家
function startRideHome() {
  // 走路：和家长一路同行到校门后直接淡入到家
  if (pickupWalkMode === 'walk') {
    if (parentNPC) parentState = 'leaving';
    startFade(() => { cleanupRide(); arriveHome(); });
    return;
  }
  rideActive = true;
  rideMode = pickupWalkMode;
  rideTimer = 0;
  if (document.pointerLockElement) document.exitPointerLock();
  promptEl.style.display = 'none';

  // 把玩家放到远离校园的路面上（车辆沿 +x 方向行驶，相机在车后跟随）
  const startX = 0, startZ = GATE_Z + 40;
  // 乘车朝向：车头朝 +x，玩家坐姿朝 +x，相机在车后方看前方
  girl.rotation.y = Math.PI / 2;   // 朝 +x（车行方向）
  yaw = Math.PI / 2;
  camYaw = -Math.PI / 2;           // 相机在 -x 方向（车后），看向 +x
  camPitch = -0.12;
  girl.position.y = 0; onGround = true; yVel = 0;
  floorLevel = 0; currentRooftop = null; currentFloorBuilding = null;

  // 家长上车：隐藏步行家长（到家后家长在餐桌旁出现）
  if (parentNPC) { scene.remove(parentNPC); parentNPC = null; parentState = 'none'; }
  girl.userData.sitting = true;

  if (rideMode === 'car') {
    rideVehicle = makeCar(0xe53935);
    scene.add(rideVehicle);
    rideVehicle.position.set(startX, 0, startZ);
    // 玩家坐在副驾（车体略偏 +z 侧、抬高到座椅高度）
    girl.position.set(startX, 1.0, startZ + 0.45);
  } else if (rideMode === 'bus') {
    rideVehicle = makeBus(0x1e88e5);
    scene.add(rideVehicle);
    rideVehicle.position.set(startX, 0, startZ);
    girl.position.set(startX, 1.5, startZ + 0.6);
  } else if (rideMode === 'subway') {
    rideVehicle = makeSubwayCar();
    scene.add(rideVehicle);
    rideVehicle.position.set(startX, 0, startZ);
    girl.position.set(startX, 1.5, startZ + 0.6);
    // 隧道：两侧深色长墙 + 顶部，制造封闭感
    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x202830, roughness: 0.95 });
    for (const side of [-1, 1]) {
      const wall = new THREE.Mesh(new THREE.BoxGeometry(80, 5.5, 0.4), tunnelMat);
      wall.position.set(startX, 2.75, startZ + side * 3.2);
      scene.add(wall); rideLights.push(wall);
    }
    const ceiling = new THREE.Mesh(new THREE.BoxGeometry(80, 0.4, 7), tunnelMat);
    ceiling.position.set(startX, 5.4, startZ);
    scene.add(ceiling); rideLights.push(ceiling);
    // 隧道灯：在车厢一侧前方延伸，随车前移循环
    const lm = new THREE.MeshStandardMaterial({ color: 0xffe082, emissive: 0xffe082, emissiveIntensity: 1.0 });
    for (let i = 0; i < 16; i++) {
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), lm);
      lamp.position.set(startX - 12 + i * 3, 3.2, startZ - 2.9);
      lamp.userData.isLamp = true;
      scene.add(lamp);
      rideLights.push(lamp);
    }
  }
  const modeText = { car: '坐车回家', bus: '坐公交回家', subway: '坐地铁回家' }[rideMode];
  promptEl.innerHTML = modeText + '…';
  promptEl.style.display = 'block';
}

function updateRide(dt) {
  if (!rideActive) return;
  rideTimer += dt;
  // 车辆持续向前移动（+x 方向），相机由 updateCamera 处理（跟随 girl）
  const speed = rideMode === 'subway' ? 24 : (rideMode === 'bus' ? 16 : 20);
  const dx = speed * dt;
  if (rideVehicle) rideVehicle.position.x += dx;
  girl.position.x += dx;   // 玩家随车一起移动，保持相对位置
  // 隧道：墙体随车保持包围；灯随车前移并循环（产生速度感）
  if (rideLights.length) {
    rideLights.forEach(l => {
      if (l.userData.isLamp) {
        l.position.x += dx;
        if (l.position.x > girl.position.x + 12) l.position.x -= 48;
      } else {
        // 隧道墙体跟随车辆，使相机始终处于封闭隧道中
        l.position.x += dx;
      }
    });
  }
  // 乘车结束
  if (rideTimer >= RIDE_DURATION) {
    startFade(() => { cleanupRide(); arriveHome(); });
  }
}

// 递归释放几何体 / 材质，避免反复乘车、往返家场景造成内存泄漏
function disposeObj(root) {
  if (!root) return;
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

function cleanupRide() {
  rideActive = false;
  rideTimer = 0;
  if (rideVehicle) { scene.remove(rideVehicle); disposeObj(rideVehicle); rideVehicle = null; }
  if (rideLights.length) { rideLights.forEach(l => { scene.remove(l); disposeObj(l); }); rideLights = []; }
  girl.userData.sitting = false;
}

function arriveHome() {
  buildHome();
  atHome = true;
  girl.position.set(HOME.cx, 0, HOME.cz + 5);
  girl.position.y = 0; onGround = true; yVel = 0;
  girl.rotation.y = Math.PI; yaw = Math.PI; camYaw = 0; camPitch = -0.35;
  floorLevel = 0; currentRooftop = null; currentFloorBuilding = null; currentFloor = 1;
  // 清理可能残留的活动状态（不触发 fx，避免错误加分）
  if (readingBook) closeBookUI();
  if (quizState.active) { quizState.active = false; quizEl.style.display = 'none'; document.body.classList.remove('quiz-open'); }
  if (stateLock) { stateLock = false; stateTimer = 0; }
  currentState = null;
  girl.userData.path = null; girl.userData.targetRot = undefined; girl.userData.sitting = false;
  // 时间推进到晚上
  dayTime = DAY_LEN * 0.86;   // ≈ 19:54
  currentPeriod = periodAt(hourNow());
  routeStudentAll();
  promptEl.innerHTML = '到家啦！吃饭 / 写作业 / 玩耍，累了就上床<b>睡觉</b>';
  promptEl.style.display = 'block';

}

// 睡觉后：推进到次日清晨，回到学校
function leaveHomeToNextDay() {
  startFade(() => {
    atHome = false;
    if (rideParentSeat) { if (homeGroup) homeGroup.remove(rideParentSeat); rideParentSeat = null; }
    if (homeGroup) { scene.remove(homeGroup); disposeObj(homeGroup); homeGroup = null; }
    // 交通方式带来的状态加成（到家路上已用，这里仅补全次日体力/心情）
    if (rideMode === 'walk') { stats.energy = Math.max(stats.energy, 30); }
    else if (rideMode === 'car') { stats.mood += 5; }
    else if (rideMode === 'bus') { stats.mood += 3; }
    else if (rideMode === 'subway') { stats.mood += 4; }
    rideMode = 'walk';
    // 清理状态
    if (readingBook) closeBookUI();
    if (quizState.active) { quizState.active = false; quizEl.style.display = 'none'; document.body.classList.remove('quiz-open'); }
    if (stateLock) { stateLock = false; stateTimer = 0; }
    currentState = null;
    girl.userData.path = null; girl.userData.targetRot = undefined; girl.userData.sitting = false;
    // 推进到次日 7:00
    dayTime = 0; dayCount++;
    girl.position.copy(START_POS);
    girl.position.y = 0; onGround = true; yVel = 0;
    floorLevel = 0; currentRooftop = null; currentFloorBuilding = null; currentFloor = 1;
    yaw = 0; camYaw = 0; camPitch = -0.35;
    npcs.forEach(st => { st.wentHome = false; st.group.visible = true; st.path = []; st.state = 'idle'; });
    currentPeriod = periodAt(hourNow());
    routeStudentAll();
    clampStats(); updateStatsUI(); updateStateUI();
  });
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(loopClock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

// 启动：状态 UI + 属性 UI + NPC 初始路由
updateStateUI();
updateStatsUI();
updateFriendsUI();
repathAll();
animate();

// 调试钩子：仅当 URL 带 #debug 时暴露内部状态供自动化验证，不影响正常游戏
if (location.hash === '#debug') {
  window.__game = {
    scene, camera, renderer, girl, colliders, cars, npcs, bball, stats, sun, hemi,
    hoopPos, hourNow, collidePlayer, enterState, exitState, tryInteract, removeBall,
    findPath, updateNPCs, friendships, accessibleBuildings,
    get floorY() { return floorLevel; },
    get onRooftop() { return currentRooftop ? currentRooftop.name : null; },
    get camYaw() { return camYaw; },
    get camPitch() { return camPitch; },
    get dayTime() { return dayTime; },
    set dayTime(v) { dayTime = v; },
    get period() { return currentPeriod.name; },
    get skyColor() { return scene.background.getHex(); },
    get carPositions() { return cars.map(c => [Math.round(c.position.x * 100) / 100, Math.round(c.position.z * 100) / 100]); },
    get npcPositions() { return npcs.map(n => [Math.round(n.group.position.x * 100) / 100, Math.round(n.group.position.z * 100) / 100]); },
    testScore() {
      if (bball.ball) removeBall();
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 6), ballMat);
      mesh.position.set(hoopPos.x, hoopPos.y + 1, hoopPos.z);
      scene.add(mesh);
      bball.ball = { mesh, vel: new THREE.Vector3(0, -6, 0), t: 0, settled: 0 };
    },
  };
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
