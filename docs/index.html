<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>阳光小学生的一天 - 校园生活与温馨小家</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #9fd6ff; font-family: "Microsoft YaHei", -apple-system, sans-serif;
    touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #app { width: 100vw; height: 100vh; display: block; touch-action: none; }
  
  /* 顶部 UI */
  #ui {
    position: fixed; left: 0; top: 0; right: 0; z-index: 20;
    pointer-events: none; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #topbar {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 14px; font-size: 14px;
  }
  #info { background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 12px; line-height: 1.5; pointer-events: auto; }
  #info #period { color: #ffd966; font-weight: bold; font-size: 16px; }
  #info #clock { font-family: monospace; font-size: 16px; margin: 0 6px; }
  #info #day { color: #a5d6ff; }
  #questHint {
    margin-top: 5px; font-size: 13px; color: #fff; background: rgba(25,118,210,0.8);
    padding: 4px 10px; border-radius: 8px; display: inline-block; font-weight: bold;
  }
  #stats {
    display: flex; gap: 10px; background: rgba(0,0,0,0.6);
    padding: 8px 12px; border-radius: 12px; line-height: 1.4;
  }
  .stat { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .stat i { font-style: normal; width: 26px; }
  .stat .bar {
    width: 65px; height: 8px; background: rgba(255,255,255,0.2);
    border-radius: 4px; overflow: hidden;
  }
  .stat .bar > div { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .stat em { font-style: normal; font-family: monospace; font-size: 12px; min-width: 20px; text-align: right; }
  #st-grades { background: #64b5f6; }
  #st-energy { background: #81c784; }
  #st-mood   { background: #ffd54f; }
  #st-know   { background: #ba68c8; }
  #bball {
    background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 12px;
    font-size: 13px; display: none; margin-top: 6px; text-align: right;
  }
  #bball b { color: #ffd966; font-family: monospace; font-size: 16px; }

  /* 提示与交互气泡 */
  #prompt {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 25;
    background: rgba(20,20,35,0.88); color: #fff; padding: 10px 22px; border-radius: 24px;
    font-size: 15px; display: none; pointer-events: auto; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.45); border: 2px solid #ffd966; text-align: center;
  }
  #prompt b { color: #ffd966; }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; background: rgba(255,255,255,0.7); border-radius: 50%;
    z-index: 15; pointer-events: none; display: none;
  }
  #lockhint {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 30;
    background: rgba(0,0,0,0.75); color:#fff; padding: 14px 24px; border-radius: 12px;
    font-size: 14px; text-align:center; pointer-events: none; display:none;
  }
  #help {
    position: fixed; left: 12px; bottom: 12px; z-index: 15;
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 12px; border-radius: 10px;
    font-size: 12px; line-height: 1.6; pointer-events: none; max-width: 340px;
  }
  #help kbd { background: #fff; color: #222; border-radius: 4px; padding: 1px 5px; font-family: monospace; }
  #fade {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: #000; opacity: 0; z-index: 50; pointer-events: none; transition: opacity 0.4s ease;
  }
  #rideOverlay {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
    z-index: 52; font-size: 22px; font-weight: bold; color: #ffd966;
    background: rgba(0,0,0,0.85); padding: 18px 32px; border-radius: 18px;
    display: none; pointer-events: none; text-align: center; line-height: 1.6; width: 80%; max-width: 440px;
  }

  /* 答题面板 */
  #quiz {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 45;
    background: rgba(28,32,55,0.98); color: #fff; padding: 20px 24px; border-radius: 20px;
    width: 480px; max-width: 90vw; max-height: 85vh; overflow-y: auto; display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.7);
    border: 3px solid #ffd966; text-align: center;
  }
  #quizHead { display: flex; justify-content: space-between; align-items: center; color: #ffd966; margin-bottom: 6px; }
  #quizTitle { font-size: 20px; font-weight: bold; }
  #quizProgress { font-size: 14px; color: #a5d6ff; }
  #quizSpeak {
    background: #ffd966; color: #222; border: none; border-radius: 999px;
    padding: 6px 18px; font-size: 14px; font-weight: bold; cursor: pointer; margin: 6px auto; display: inline-block;
  }
  #quizQuestion {
    font-size: 22px; font-weight: bold; line-height: 1.5; margin: 12px 0;
    min-height: 50px; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  #quizOpts { display: flex; flex-direction: column; gap: 10px; }
  #quizOpts button {
    display: block; width: 100%; padding: 12px 8px; border: none; border-radius: 12px;
    font-size: 18px; font-weight: bold; color: #fff; cursor: pointer; min-height: 48px;
  }
  #quizOpts .optA { background: #1e88e5; }
  #quizOpts .optB { background: #43a047; }
  #quizOpts .optC { background: #fb8c00; }
  #quizMsg { font-size: 17px; margin: 8px 0 2px; min-height: 26px; font-weight: bold; }
  #quizQuit {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 8px; padding: 6px 18px; font-size: 14px; cursor: pointer; margin-top: 8px;
  }

  /* 放学接送面板 */
  #pickup {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 44;
    background: rgba(25,30,48,0.98); color: #fff; padding: 22px; border-radius: 18px;
    width: 360px; max-width: 90vw; display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.7);
    border: 2px solid #ffd966; text-align: center;
  }
  #pickupHead { font-size: 20px; font-weight: bold; color: #ffd966; margin-bottom: 6px; }
  #pickupBody { font-size: 14px; color: #e1f5fe; margin-bottom: 16px; }
  #pickupOpts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pickup-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 12px; padding: 12px 8px; font-size: 14px; cursor: pointer;
    color: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .pickup-btn:active { background: rgba(255,215,102,0.3); }
  .pickup-icon { font-size: 26px; }

  /* 同学聊天 */
  #chat {
    position: fixed; left: 50%; bottom: 35px; transform: translateX(-50%); z-index: 40;
    background: rgba(20,22,35,0.96); color: #fff; padding: 0; border-radius: 14px;
    font-size: 14px; width: 440px; max-width: 92vw; display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255,255,255,0.2);
  }
  #chatHead { padding: 10px 14px; background: rgba(255,255,255,0.1); font-weight: bold; display: flex; justify-content: space-between; }
  #chatFri { font-size: 12px; color: #ffb74d; }
  #chatBody { padding: 12px 14px; line-height: 1.6; }
  #chatBody .npc-line { color: #e3f2fd; margin-bottom: 8px; }
  #chatBody .me-line { color: #c8e6c9; margin-bottom: 8px; text-align: right; }
  #chatOpts { padding: 0 14px 12px; }
  #chatOpts button {
    display: block; width: 100%; margin-top: 6px; padding: 8px 10px;
    background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; font-size: 13px; cursor: pointer; text-align: left;
  }

  /* 触屏交互层 (针对 Pad / 手机优化) */
  #touchUI { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 18; display: block; pointer-events: none; }
  #joyZone { position: absolute; left: 0; bottom: 0; width: 45%; height: 60%; pointer-events: auto; touch-action: none; }
  #joyBase {
    position: absolute; left: 40px; bottom: 40px; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); touch-action: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: rgba(255,255,255,0.55); pointer-events: none;
  }
  #lookZone { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: auto; touch-action: none; }
  #touchBtns { position: absolute; right: 20px; bottom: 90px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
  .tbtn {
    width: 66px; height: 66px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.6); color: #fff; font-size: 13px; line-height: 1.15;
    pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .tbtn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
  .tbtn-primary { width: 80px; height: 80px; font-size: 15px; font-weight: bold; background: rgba(255,215,102,0.3); border: 2px solid #ffd966; }
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   渲染器与场景
============================================================ */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd6ff);
scene.fog = new THREE.Fog(0x9fd6ff, 180, 480);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);

const hemi = new THREE.HemisphereLight(0xcfeaff, 0x6b8f3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 10; sun.shadow.camera.far = 420;
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;  sun.shadow.camera.bottom = -120;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   纹理生成工具
============================================================ */
function makeGroundTexture(base, dotFn) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 600; i++) {
    x.fillStyle = dotFn(Math.floor(Math.random() * 80));
    x.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ============================================================
   常量与碰撞
============================================================ */
const MAIN = { cx: 0, cz: -30, w: 38, d: 24 };
const GATE_Z = 105;
const CAF  = { cx: -55, cz: 55,  w: 24, d: 20 };
const COURT= { cx: 62,  cz: 44,  w: 14, d: 24 };
const FIELD= { cx: 63,  cz: 8,   r: 22 };
const HOME = { cx: 260, cz: 260, w: 26, d: 18, h: 5 };

const colliders = [];
function addCollider(x0, x1, z0, z1) { colliders.push({ x0, x1, z0, z1 }); }

// 校园外墙
addCollider(-90, 90, -110.5, -109.6);
addCollider(-90, -12, 109.6, 110.5);
addCollider(12, 90, 109.6, 110.5);
addCollider(-90.5, -89.6, -110, 110);
addCollider(89.6, 90.5, -110, 110);

// 主楼外墙（留门洞 |x|<3）
addCollider(-19, 19, -42.5, -41.6);
addCollider(-19.5, -18.6, -42, -18);
addCollider(18.6, 19.5, -42, -18);
addCollider(-19, -3, -18.5, -17.6);
addCollider(3, 19, -18.5, -17.6);

// 温馨小家外墙（留门洞）
addCollider(HOME.cx - HOME.w/2, HOME.cx + HOME.w/2, HOME.cz - HOME.d/2, HOME.cz - HOME.d/2 + 0.5);
addCollider(HOME.cx - HOME.w/2, HOME.cx - HOME.w/2 + 0.5, HOME.cz - HOME.d/2, HOME.cz + HOME.d/2);
addCollider(HOME.cx + HOME.w/2 - 0.5, HOME.cx + HOME.w/2, HOME.cz - HOME.d/2, HOME.cz + HOME.d/2);
addCollider(HOME.cx - HOME.w/2, HOME.cx - 2, HOME.cz + HOME.d/2 - 0.5, HOME.cz + HOME.d/2);
addCollider(HOME.cx + 2, HOME.cx + HOME.w/2, HOME.cz + HOME.d/2 - 0.5, HOME.cz + HOME.d/2);

function collidePlayer(pos) {
  const r = 0.6;
  for (const c of colliders) {
    if (pos.x > c.x0 - r && pos.x < c.x1 + r && pos.z > c.z0 - r && pos.z < c.z1 + r) {
      const dxL = pos.x - (c.x0 - r), dxR = (c.x1 + r) - pos.x;
      const dzN = pos.z - (c.z0 - r), dzS = (c.z1 + r) - pos.z;
      const m = Math.min(dxL, dxR, dzN, dzS);
      if (m === dxL) pos.x = c.x0 - r;
      else if (m === dxR) pos.x = c.x1 + r;
      else if (m === dzN) pos.z = c.z0 - r;
      else pos.z = c.z1 + r;
    }
  }
}

/* ============================================================
   校园与教室场景构建
============================================================ */
const grassTex = makeGroundTexture('#6aa84f', g => `rgb(${g-20},${g+60},${g-20})`);
grassTex.repeat.set(40, 40);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const plazaTex = makeGroundTexture('#b7a99a', g => `rgb(${g+50},${g+40},${g+30})`);
plazaTex.repeat.set(6, 6);
const plaza = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: plazaTex, roughness: 1 }));
plaza.rotation.x = -Math.PI / 2; plaza.position.set(0, 0.03, 40); plaza.receiveShadow = true; scene.add(plaza);

const mainPath = new THREE.Mesh(new THREE.PlaneGeometry(10, 130), new THREE.MeshStandardMaterial({ map: plazaTex, roughness: 1 }));
mainPath.rotation.x = -Math.PI / 2; mainPath.position.set(0, 0.04, 45); mainPath.receiveShadow = true; scene.add(mainPath);

// 主楼与教室
const buildGroup = new THREE.Group(); scene.add(buildGroup);
const floorSlab = new THREE.Mesh(new THREE.BoxGeometry(MAIN.w, 0.5, MAIN.d), new THREE.MeshStandardMaterial({ color: 0xe0e0e0 }));
floorSlab.position.set(MAIN.cx, 0.25, MAIN.cz); buildGroup.add(floorSlab);

const sideMat = new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.8 });
const sideL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 7, MAIN.d), sideMat);
sideL.position.set(MAIN.cx - MAIN.w/2, 3.5, MAIN.cz); buildGroup.add(sideL);
const sideR = sideL.clone(); sideR.position.x = MAIN.cx + MAIN.w/2; buildGroup.add(sideR);
const backW = new THREE.Mesh(new THREE.BoxGeometry(MAIN.w, 7, 0.5), sideMat);
backW.position.set(MAIN.cx, 3.5, MAIN.cz - MAIN.d/2); buildGroup.add(backW);

// 动态黑板
const boardCanvas = document.createElement('canvas');
boardCanvas.width = 1024; boardCanvas.height = 256;
const boardCtx = boardCanvas.getContext('2d');
const boardTexture = new THREE.CanvasTexture(boardCanvas);

function updateBlackboard(title, p1, p2, teacher) {
  boardCtx.fillStyle = '#1b4d2e'; boardCtx.fillRect(0, 0, 1024, 256);
  boardCtx.strokeStyle = '#8d6e63'; boardCtx.lineWidth = 12; boardCtx.strokeRect(0, 0, 1024, 256);
  boardCtx.fillStyle = '#ffd54f'; boardCtx.font = 'bold 36px "Microsoft YaHei"';
  boardCtx.fillText('★ ' + title + ' ★', 40, 60);
  boardCtx.fillStyle = '#ffffff'; boardCtx.font = '30px "KaiTi", "Microsoft YaHei"';
  boardCtx.fillText(p1, 40, 120);
  boardCtx.fillText(p2, 40, 170);
  boardCtx.fillStyle = '#a5d6ff'; boardCtx.font = '26px "Microsoft YaHei"';
  boardCtx.fillText('执教老师：' + teacher, 720, 220);
  boardTexture.needsUpdate = true;
}

const blackboard = new THREE.Mesh(new THREE.PlaneGeometry(14, 3.5), new THREE.MeshStandardMaterial({ map: boardTexture }));
blackboard.position.set(MAIN.cx, 3.5, MAIN.cz - MAIN.d/2 + 0.3); buildGroup.add(blackboard);

const podium = new THREE.Mesh(new THREE.BoxGeometry(3, 1.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x6d4c41 }));
podium.position.set(MAIN.cx, 0.65, MAIN.cz - MAIN.d/2 + 3.5); buildGroup.add(podium);

function makeDesk(x, z, isPlayer = false) {

const quizEl = document.getElementById('quiz');
const quizTitleEl = document.getElementById('quizTitle');

const quizOptsEl = document.getElementById('quizOpts');
const quizMsgEl = document.getElementById('quizMsg');
const quizSpeakEl = document.getElementById('quizSpeak');
const quizQuitEl = document.getElementById('quizQuit');

let quizState = { active: false, cat: 'chinese', list: [], idx: 0, right: 0 };

function speakText(txt) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-CN'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
quizSpeakEl.onclick = () => {
  const q = quizState.list[quizState.idx];
  if (q) speakText(q.speak || q.q);
};
quizQuitEl.onclick = closeQuiz;

function startQuiz(cat, title) {
  quizState.active = true; quizState.cat = cat;
  quizState.list = [...quizBank[cat]].sort(() => Math.random() - 0.5).slice(0, 3);
  quizState.idx = 0; quizState.right = 0;
  quizTitleEl.textContent = title;
  quizEl.style.display = 'block';
  renderQuiz();
}

function renderQuiz() {
  const q = quizState.list[quizState.idx];
  quizProgressEl.textContent = `第 ${quizState.idx + 1} / ${quizState.list.length} 题`;
  quizQuestionEl.textContent = q.q;
  quizMsgEl.textContent = '';
  quizOptsEl.innerHTML = '';
  const cls = ['optA', 'optB', 'optC'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = cls[i]; btn.textContent = opt;
    btn.onclick = () => answerQuiz(i);
    quizOptsEl.appendChild(btn);
  });
  speakText(q.speak || q.q);
}

function answerQuiz(i) {
  const q = quizState.list[quizState.idx];
  if (i === q.ans) {
    quizState.right++;
    quizMsgEl.textContent = '🎉 答对啦！真聪明！';
    quizMsgEl.style.color = '#81c784';
    stats.grades += 3; stats.knowledge += 4;
  } else {
    quizMsgEl.textContent = `💡 正确答案是【${q.opts[q.ans]}】记住了哦`;
    quizMsgEl.style.color = '#ff8a80';
  }
  updateStatsUI();
  setTimeout(() => {
    quizState.idx++;
    if (quizState.idx < quizState.list.length) renderQuiz();
    else finishQuiz();
  }, 1100);
}

function finishQuiz() {
  quizTitleEl.textContent = '学习完成 🌟';
  quizProgressEl.textContent = '';
  quizQuestionEl.textContent = `本次答对 ${quizState.right} 道题！知识与成绩提升啦！`;
  quizOptsEl.innerHTML = '';
  quizMsgEl.textContent = '';
  const btn = document.createElement('button');
  btn.className = 'optB'; btn.textContent = '太棒了 (完成)';
  btn.onclick = closeQuiz; quizOptsEl.appendChild(btn);
}

function closeQuiz() {
  quizState.active = false; quizEl.style.display = 'none';
  if (stateLock) exitState();
}

function tryInteract() {
  if (quizState.active) return;

    if (girl.position.distanceTo(st.group.position) < 3.8) {

    stats.energy = Math.min(100, stats.energy + 30); stats.mood += 5; updateStatsUI();
    alert('🍱 在食堂享用了美味套餐！体力恢复！');
  } else if (state === 'homeEat') {
    stats.energy = 100; stats.mood = Math.min(100, stats.mood + 15); updateStatsUI();
    alert('🍲 吃到了妈妈做的热腾腾晚饭！体力全满！');
  } else if (state === 'homeHomework') {
    startQuiz('math', '家庭作业 - 巩固练习 ✏️');
  } else if (state === 'homePlay') {
    stats.mood = 100; stats.energy = Math.max(0, stats.energy - 5); updateStatsUI();
    alert('🎮 看了喜欢的动画片，玩了积木，心情极佳！');
  } else if (state === 'homeSleep') {
    fadeEl.style.opacity = '1';
    rideOverlay.textContent = '🌙 盖好小被子进入甜美梦乡... 呼噜噜...';
    rideOverlay.style.display = 'block';
    setTimeout(() => {
      dayCount++; dayTime = 0;
      girl.position.copy(START_POS);
      onPeriodChange();
      fadeEl.style.opacity = '0';
      rideOverlay.style.display = 'none';
      stats.energy = 100; updateStatsUI();
      alert(`☀️ 叮铃铃！新的一天开始了（第 ${dayCount} 天），精神饱满地上学去啦！`);
    }, 2400);
  }
}

/* ============================================================
   触屏 / Pad 虚拟摇杆与视角控制 (关键核心修复)
============================================================ */
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joyZone = document.getElementById('joyZone');
const lookZone = document.getElementById('lookZone');

const joyState = { active: false, id: null, cx: 0, cy: 0 };
const JOY_R = 50;
const touchMove = { fwd: 0, strafe: 0 };
let touchRun = false;

// 摇杆控制
joyZone.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  if (joyState.active) return;
  const t = e.changedTouches[0];
  const rect = joyBase.getBoundingClientRect();
  joyState.active = true; joyState.id = t.identifier;
  joyState.cx = rect.left + rect.width / 2;
  joyState.cy = rect.top + rect.height / 2;
}, { passive: false });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (joyState.active && t.identifier === joyState.id) {
      let dx = t.clientX - joyState.cx;
      let dy = t.clientY - joyState.cy;
      const dist = Math.hypot(dx, dy);
      if (dist > JOY_R) { dx = (dx / dist) * JOY_R; dy = (dy / dist) * JOY_R; }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      touchMove.strafe = dx / JOY_R;
      touchMove.fwd = -dy / JOY_R;
      touchRun = dist > JOY_R * 0.85;
    }
  }
}, { passive: false });

const endJoy = e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyState.id) {
      joyState.active = false; joyState.id = null;
      joyKnob.style.transform = 'translate(0px, 0px)';
      touchMove.fwd = 0; touchMove.strafe = 0; touchRun = false;
    }
  }
};
window.addEventListener('touchend', endJoy);
window.addEventListener('touchcancel', endJoy);

// 右侧屏幕拖拽转视角
const lookState = { active: false, id: null, lx: 0, ly: 0 };
lookZone.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  if (lookState.active) return;
  const t = e.changedTouches[0];
  lookState.active = true; lookState.id = t.identifier;
  lookState.lx = t.clientX; lookState.ly = t.clientY;
}, { passive: false });

window.addEventListener('touchmove', e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    const t = e.changedTouches[i];
    if (lookState.active && t.identifier === lookState.id) {
      const dx = t.clientX - lookState.lx;
      const dy = t.clientY - lookState.ly;
      lookState.lx = t.clientX; lookState.ly = t.clientY;
      camYaw -= dx * 0.005;
      camPitch -= dy * 0.004;
      camPitch = Math.max(-1.1, Math.min(1.1, camPitch));
    }
  }
}, { passive: false });

const endLook = e => {
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === lookState.id) {
      lookState.active = false; lookState.id = null;
    }
  }
};
window.addEventListener('touchend', endLook);
window.addEventListener('touchcancel', endLook);

// 触屏按键

  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
  el.addEventListener('click', fn);
};

   电脑键盘与鼠标视角
============================================================ */
const keys = {};
let camYaw = 0, camPitch = -0.3;
let yaw = 0;
const SPEED = 8.5;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') tryInteract();
  if (e.code === 'KeyQ') fastForward = !fastForward;
  if (e.code === 'KeyR') girl.position.copy(START_POS);
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const isTouch = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
if (!isTouch) {
  renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement === renderer.domElement) {
      camYaw -= e.movementX * 0.0025;
      camPitch -= e.movementY * 0.0025;
      camPitch = Math.max(-1.1, Math.min(1.1, camPitch));
    }
  });
}

function updateCamera(immediate = false) {
  const back = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
  const targetCamPos = girl.position.clone().addScaledVector(back, 8.5);
  targetCamPos.y += 5.2;
  
  if (immediate) camera.position.copy(targetCamPos);
  else camera.position.lerp(targetCamPos, 0.22);
  camera.quaternion.setFromEuler(new THREE.Euler(camPitch, camYaw, 0, 'YXZ'));
}
